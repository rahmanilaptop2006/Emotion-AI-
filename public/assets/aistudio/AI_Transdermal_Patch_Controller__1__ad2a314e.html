<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Transdermal Patch Controller</title>
<style>
:root{--bg:#e9eef0;--fg:#10181c;--card:#fff;--line:#c6d3d6;--acc:#0e8f8a;--warn:#b3541e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1517;--fg:#e6f0f1;--card:#1a2427;--line:#2c3b3f;--acc:#3fd1c9;--warn:#f0a070}}
:root[data-theme="dark"]{--bg:#0f1517;--fg:#e6f0f1;--card:#1a2427;--line:#2c3b3f;--acc:#3fd1c9;--warn:#f0a070}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#c{flex:1;min-height:0;width:100%;touch-action:none;cursor:grab}
.views{display:flex;gap:6px;justify-content:center;padding:4px 8px}
button{font:600 .82rem system-ui,sans-serif;border:1px solid var(--acc);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:999px}
button.on{background:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:8px 12px 20px;display:flex;flex-direction:column;gap:10px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{font:600 .95rem Georgia,serif;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.big{font:600 1.5rem Georgia,serif}
.small{font-size:.8rem;opacity:.75}
#log{max-height:96px;overflow-y:auto;font-size:.8rem;margin:6px 0 0;padding-left:16px}
#chat{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;margin-bottom:8px}
.m{padding:7px 10px;border-radius:10px;max-width:88%;white-space:pre-wrap}
.u{align-self:flex-end;background:var(--acc);color:#fff}
.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
#cf{display:flex;gap:6px}
#cf input{flex:1;min-width:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="views">
<button data-v="top" class="on">Black side</button>
<button data-v="bottom">Patch side</button>
<button data-v="xray">Inside</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,9);
scene.add(new THREE.AmbientLight(0xffffff,.7));
var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,5,8);scene.add(dl);
var dl2=new THREE.DirectionalLight(0x88ffee,.4);dl2.position.set(-5,-4,-6);scene.add(dl2);
function rr(w,h,r){var s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function slab(w,h,r,d,b){return new THREE.ExtrudeGeometry(rr(w,h,r),{depth:d,bevelEnabled:true,bevelSize:b,bevelThickness:b,bevelSegments:3,curveSegments:12})}
var dev=new THREE.Group();scene.add(dev);
/* thin black shell: about 0.16 units thick */
var shellMat=new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:.35,metalness:.5,transparent:true});
dev.add(new THREE.Mesh(slab(3.2,2.1,.55,.1,.03),shellMat));
var ledMat=new THREE.MeshBasicMaterial({color:0x3fd1c9});
var led=new THREE.Mesh(new THREE.TorusGeometry(.2,.03,10,40),ledMat);led.position.set(-.85,.4,.135);dev.add(led);
var dot=new THREE.Mesh(new THREE.CircleGeometry(.09,24),ledMat);dot.position.set(-.85,.4,.136);dev.add(dot);
/* charging bay on right edge: cable lives inside the device */
var bay=new THREE.Mesh(new THREE.BoxGeometry(.06,.46,.07),new THREE.MeshStandardMaterial({color:0x000000,roughness:.9}));bay.position.set(1.61,0,.05);dev.add(bay);
var metal=new THREE.MeshStandardMaterial({color:0x9a9ea3,metalness:.9,roughness:.3});
var plug=new THREE.Mesh(new THREE.BoxGeometry(.3,.38,.06),metal);plug.position.set(1.47,0,.05);dev.add(plug);
var cableMat=new THREE.MeshStandardMaterial({color:0x1a1a1d,roughness:.6});
var cable=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,10),cableMat);cable.rotation.z=Math.PI/2;dev.add(cable);
/* patch side: thin adhesive pad */
var pad=new THREE.Mesh(slab(3.6,2.5,.65,.02,.012),new THREE.MeshStandardMaterial({color:0xe3b894,roughness:.9}));pad.position.z=-.07;dev.add(pad);
var resMat=new THREE.MeshStandardMaterial({color:0xbfe9e5,roughness:.4,emissive:0x2a8f88,emissiveIntensity:.5});
var res=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.02,48),resMat);res.rotation.x=Math.PI/2;res.position.set(0,0,-.09);dev.add(res);
var mn=new THREE.MeshStandardMaterial({color:0xcfd4d8,metalness:.8,roughness:.3});
for(var i=0;i<7;i++)for(var j=0;j<7;j++){var a=(i-3)*.17,b=(j-3)*.17;if(a*a+b*b>.45)continue;var m=new THREE.Mesh(new THREE.ConeGeometry(.022,.05,6),mn);m.rotation.x=-Math.PI/2;m.position.set(a,b,-.12);dev.add(m)}
/* inside parts */
var inner=new THREE.Group();dev.add(inner);
var pcb=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.5,.015),new THREE.MeshStandardMaterial({color:0x0b5d3b,roughness:.5}));pcb.position.z=.03;inner.add(pcb);
var chipMat=new THREE.MeshStandardMaterial({color:0x14181b,roughness:.3,metalness:.6,emissive:0x0e8f8a,emissiveIntensity:.6});
var chip=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.04),chipMat);chip.position.set(-.2,.1,.06);inner.add(chip);
var pm=new THREE.MeshStandardMaterial({color:0xd4af37,metalness:.9,roughness:.3});
for(var k=0;k<6;k++)[1,-1].forEach(function(s){var p1=new THREE.Mesh(new THREE.BoxGeometry(.06,.12,.02),pm);p1.position.set(-.2+(k-2.5)*.12,.1+s*.4,.05);inner.add(p1);var p2=new THREE.Mesh(new THREE.BoxGeometry(.12,.06,.02),pm);p2.position.set(-.2+s*.4,.1+(k-2.5)*.12,.05);inner.add(p2)});
var batt=new THREE.Mesh(new THREE.BoxGeometry(.9,.8,.05),new THREE.MeshStandardMaterial({color:0x3c6ea5,roughness:.5}));batt.position.set(.7,-.1,.06);inner.add(batt);
var ant=new THREE.Mesh(new THREE.TorusGeometry(.28,.02,8,32,Math.PI*1.5),new THREE.MeshBasicMaterial({color:0x3fd1c9}));ant.position.set(-.95,-.4,.05);inner.add(ant);
inner.visible=false;
/* view */
var target={x:0,y:0},rot={x:0,y:0},opa=1,drag=false,lx=0,ly=0;
function setView(v){target.x=v==='xray'?-.35:0;target.y=v==='bottom'?Math.PI:(v==='xray'?.5:0);opa=v==='xray'?.15:1;inner.visible=v==='xray';
document.querySelectorAll('.views button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
document.querySelectorAll('.views button').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v)})});
canvas.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',function(){drag=false});
canvas.addEventListener('pointermove',function(e){if(!drag)return;target.y+=(e.clientX-lx)*.01;target.x+=(e.clientY-ly)*.01;lx=e.clientX;ly=e.clientY});
function resize(){var w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w/h<.9?11:(w/h<1.3?9.5:7);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
/* docked cable (stored inside the device) */
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
cable.scale.y=.3;cable.position.set(1.2,0,.05);
function loop(t){requestAnimationFrame(loop);
rot.x+=(target.x-rot.x)*.1;rot.y+=(target.y-rot.y)*.1;dev.rotation.x=rot.x;dev.rotation.y=rot.y;
shellMat.opacity+=(opa-shellMat.opacity)*.12;
var pulse=reduce?1:.6+.4*Math.sin(t*.003);
chipMat.emissiveIntensity=.3+pulse;resMat.emissiveIntensity=.5;
ledMat.color.setRGB(.25*pulse,.8*pulse,.78*pulse);
renderer.render(scene,cam)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
